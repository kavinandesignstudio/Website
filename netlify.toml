# Netlify: connects to your GitHub repo, builds with Python, serves public/
[build]
  command = "python build.py"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.12"

# Send http://kavinandesignstudio.com to https://www.kavinandesignstudio.com
[[redirects]]
  from = "https://kavinandesignstudio.com/*"
  to = "https://www.kavinandesignstudio.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
